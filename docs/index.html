<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#5ec8ff"/>
<title>Слияние на острове</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#1a3a5c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#213}
#app{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(#7ec8ff,#c8ecff 40%,#9ad47a)}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.7));backdrop-filter:blur(6px)}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pill.energy{background:#fff3c4}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border:0;border-radius:12px;background:#fff;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
#board-wrap{position:absolute;left:0;right:0;top:56px;bottom:108px;display:flex;align-items:center;justify-content:center;padding:4px}
#board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:min(96vw,460px);aspect-ratio:7/9;background:rgba(255,255,255,.35);border-radius:16px;padding:6px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.15)}
.cell{position:relative;background:rgba(255,255,255,.55);border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.cell.hl{box-shadow:inset 0 0 0 2px #ffd24a}
.cell.drop-ok{box-shadow:inset 0 0 0 3px #4ad47a;background:#e8ffe8}
.cell.drop-merge{box-shadow:inset 0 0 0 3px #ff8ac8;background:#ffe8f6}
.cell img{width:86%;height:86%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));transition:transform .12s}
.cell .badge{position:absolute;right:2px;bottom:2px;font-size:9px;font-weight:800;background:#fff;border-radius:6px;padding:0 3px;color:#555}
.cell.gen::after{content:'⚡';position:absolute;top:1px;left:2px;font-size:10px}
.drag-ghost{position:fixed;z-index:50;width:56px;height:56px;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;gap:6px;padding:6px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(255,255,255,.95));justify-content:space-around}
.navbtn{flex:1;max-width:90px;border:0;border-radius:14px;padding:8px 4px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.navbtn span{font-size:20px}
.navbtn.active{background:#ffe08a}
#orders{position:absolute;left:6px;right:6px;bottom:100px;z-index:11;display:flex;gap:6px;overflow-x:auto;padding:4px;scrollbar-width:none}
#orders::-webkit-scrollbar{display:none}
.order-card{min-width:130px;background:#fff;border-radius:14px;padding:6px 8px;box-shadow:0 3px 10px rgba(0,0,0,.15);display:flex;gap:6px;align-items:center;font-size:11px}
.order-card img.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#eef}
.order-card .need{display:flex;gap:2px}
.order-card .need img{width:28px;height:28px}
.order-card button{margin-left:auto;border:0;background:#4ad47a;color:#fff;font-weight:800;border-radius:10px;padding:6px 8px;cursor:pointer}
.order-card button:disabled{background:#ccc}
.modal{position:absolute;inset:0;z-index:40;background:rgba(20,40,70,.55);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-height:86%;background:#fff;border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet h2{font-size:18px;margin-bottom:8px}
.sheet .close{float:right;border:0;background:#eee;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.zone{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#f5f8ff;margin:8px 0}
.zone img{width:64px;height:64px;object-fit:contain}
.zone button{margin-left:auto;border:0;background:#6a9cff;color:#fff;font-weight:800;border-radius:12px;padding:8px 12px;cursor:pointer}
.zone button:disabled{background:#bbb}
.zone.done{background:#e8ffe8}
.tut{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
.tut.show{display:flex}
.tut .bubble{background:#fff;border-radius:18px;padding:16px;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tut .bubble button{margin-top:12px;border:0;background:#ff8ac8;color:#fff;font-weight:800;border-radius:12px;padding:10px 18px;cursor:pointer}
#intro{position:absolute;inset:0;z-index:60;background:url(assets/ui/bg_island.webp) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px}
#intro .card{background:rgba(255,255,255,.94);border-radius:22px;padding:20px;width:100%;max-width:360px;text-align:center;margin-bottom:24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#intro h1{font-size:22px;margin-bottom:6px;color:#3a5}
#intro p{font-size:13px;color:#456;margin-bottom:14px;line-height:1.4}
#intro button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;margin:6px 0;cursor:pointer}
#intro .go{background:linear-gradient(#ff9ad4,#ff6ab0);color:#fff}
#intro .cont{background:#fff;border:2px solid #ff9ad4;color:#c45}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:30;background:#213;color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
.ver{position:absolute;bottom:4px;right:8px;font-size:10px;color:rgba(0,0,0,.35);z-index:5}
.range{width:100%;margin:8px 0}
.story{background:#fff8e8;border-radius:12px;padding:10px;margin:8px 0;font-size:13px;line-height:1.4}
.task{display:flex;justify-content:space-between;padding:8px;background:#f0f6ff;border-radius:10px;margin:6px 0;font-size:13px}
.task.done{opacity:.55;text-decoration:line-through}
</style>
</head>
<body>
<div id="app">
  <div id="intro">
    <div class="card">
      <img src="assets/ui/app_icon.webp" alt="" style="width:88px;height:88px;border-radius:20px;margin-bottom:8px"/>
      <h1>Слияние на острове</h1>
      <p>Объединяй одинаковые предметы, выполняй заказы и восстанавливай сказочный остров из руин!</p>
      <button class="go" id="btn-start">Начать</button>
      <button class="cont" id="btn-continue" style="display:none">Продолжить</button>
      <div style="font-size:11px;color:#89a;margin-top:8px">v2.0.0 · без рекламы</div>
    </div>
  </div>
  <div class="topbar" id="topbar" style="display:none">
    <div class="pill">🪙 <span id="ui-coins">0</span></div>
    <div class="pill">💎 <span id="ui-gems">0</span></div>
    <div class="pill energy">⚡ <span id="ui-energy">0</span>/<span id="ui-energy-max">0</span></div>
    <div class="pill">⭐ <span id="ui-level">1</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-mute" title="Звук">🔊</button>
  </div>
  <div id="board-wrap" style="display:none"><div id="board"></div></div>
  <div id="orders" style="display:none"></div>
  <div class="bottom" id="bottom" style="display:none">
    <button class="navbtn active" data-tab="board"><span>🧩</span>Поле</button>
    <button class="navbtn" data-tab="island"><span>🏝️</span>Остров</button>
    <button class="navbtn" data-tab="tasks"><span>📋</span>Задания</button>
    <button class="navbtn" data-tab="book"><span>📖</span>Книга</button>
  </div>
  <canvas id="fx"></canvas>
  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="tut" id="tut"><div class="bubble"><div id="tut-text"></div><button id="tut-next">Далее</button></div></div>
  <div class="ver">v2.0.0</div>
</div>
<script src="game.js"></script>
</body>
</html>

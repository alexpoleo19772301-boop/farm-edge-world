<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2744"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Ферма на краю света</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --panel:#243044;--accent:#ffd54f;--heart:#e91e8c;--bad:#f44336;--moon:#b39ddb;
  --soil:#8b5a2b;--soil2:#6b4423;
}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#070b14;color:#eee;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#app.season-spring{background:linear-gradient(#5eb0e0 0%,#7ec87a 45%,#2d5a32 100%)}
#app.season-summer{background:linear-gradient(#3aa0ff 0%,#6bc96a 40%,#2a6b30 100%)}
#app.season-autumn{background:linear-gradient(#6a8ab0 0%,#c4a35a 40%,#5a3a20 100%)}
#app.season-winter{background:linear-gradient(#9bb8d0 0%,#cfe0ea 35%,#4a6a50 100%)}
.wx-rain::before,.wx-storm::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:14;background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(180,220,255,.12) 8px 10px);animation:rain 0.4s linear infinite;opacity:.55}
.wx-storm::before{opacity:.75;animation-duration:.25s}
.wx-drought #island{filter:saturate(.7) brightness(1.08)}
.wx-storm #island{animation:shake .4s infinite}
@keyframes rain{to{background-position:0 40px}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.topbar{display:flex;gap:6px;padding:8px 8px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,0,0,.5);backdrop-filter:blur(10px);flex-wrap:wrap;align-items:center;z-index:30}
.stat{background:rgba(36,48,68,.92);border-radius:12px;padding:5px 9px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;white-space:nowrap;border:1px solid rgba(255,255,255,.08)}
.btn{border:none;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;background:var(--accent);color:#1a1f2e}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.zonebar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;z-index:25;background:rgba(0,0,0,.25)}
.zbtn{flex-shrink:0;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.zbtn.on{background:var(--accent);color:#1a1f2e}
.zbtn:disabled{opacity:.35}
.stage-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:5}
.island{position:relative;padding:16px 12px 26px;border-radius:28px 28px 42% 42%/28px 28px 16% 16%;width:100%;max-width:420px;box-shadow:0 14px 0 rgba(0,0,0,.35),0 22px 36px rgba(0,0,0,.45);transition:filter .4s}
.zone-main{background:linear-gradient(180deg,#63b84f 0%,#3d8b40 55%,#2e6b30 100%)}
.zone-ruins{background:linear-gradient(180deg,#7a8a6a 0%,#5a6a50 55%,#3a4a38 100%)}
.zone-moon{background:linear-gradient(180deg,#5a6aaa 0%,#3a4a7a 55%,#2a3058 100%)}
.zone-pen{background:linear-gradient(180deg,#8bb85a 0%,#6a9a40 55%,#4a7028 100%)}
.island::after{content:"";position:absolute;left:8%;right:8%;bottom:-12px;height:18px;background:radial-gradient(ellipse at center,rgba(100,180,255,.4),transparent 70%);border-radius:50%}
.heart-bar{margin-bottom:8px;background:rgba(0,0,0,.35);border-radius:999px;height:18px;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.2)}
.heart-fill{height:100%;background:linear-gradient(90deg,#e91e8c,#ff80ab);width:0%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.heart-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.order-chip{width:100%;max-width:420px;background:rgba(0,0,0,.4);border:1px solid rgba(255,213,79,.35);border-radius:14px;padding:8px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.order-chip .go{margin-left:auto}
.grid{display:grid;gap:6px;justify-content:center}
.plot{width:58px;height:58px;border-radius:12px;background:linear-gradient(145deg,var(--soil),var(--soil2));border:2px solid rgba(0,0,0,.28);position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none;box-shadow:inset 0 2px 5px rgba(255,255,255,.18);transition:transform .12s,box-shadow .2s}
.plot:active{transform:scale(.94)}
.plot.locked{background:linear-gradient(145deg,#3a3a3a,#222);opacity:.72;cursor:not-allowed;font-size:20px}
.plot.selected{outline:3px solid var(--accent);outline-offset:1px}
.plot.needs-water::after{content:"💧";position:absolute;top:2px;right:2px;font-size:12px;animation:blink 1.1s infinite}
.plot .progress{position:absolute;left:4px;right:4px;bottom:3px;height:5px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden}
.plot .progress>i{display:block;height:100%;background:linear-gradient(90deg,#81c784,#ffd54f);width:0%;transition:width .4s linear}
.plot.ready{box-shadow:0 0 0 2px #ffd54f,0 0 12px rgba(255,213,79,.55);animation:pulse 1.4s infinite}
.plot.pop{animation:pop .35s ease}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{filter:brightness(1.18)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.animals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.animal{width:72px;background:rgba(0,0,0,.3);border-radius:14px;padding:8px 6px;text-align:center;font-size:11px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.animal .ae{font-size:30px;display:block;animation:bob 2s ease-in-out infinite}
.animal.ready{box-shadow:0 0 0 2px #ffd54f}
@keyframes bob{50%{transform:translateY(-3px)}}
.toolbar{display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(0,0,0,.62);backdrop-filter:blur(12px);overflow-x:auto;z-index:30}
.tool{min-width:66px;padding:8px 6px;border-radius:14px;border:2px solid transparent;background:var(--panel);color:#fff;font-size:11px;font-weight:700;text-align:center;cursor:pointer;flex-shrink:0}
.tool.active{border-color:var(--accent);background:#3a4a66;box-shadow:0 0 10px rgba(255,213,79,.25)}
.tool .t-ico{font-size:22px;display:block;line-height:1.15}
.tool .t-price{opacity:.75;font-size:10px;font-weight:600}
.toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:rgba(0,0,0,.88);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:92%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.floaters{pointer-events:none;position:absolute;inset:0;z-index:55;overflow:hidden}
.floater{position:absolute;font-weight:800;font-size:14px;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 4px #000}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-48px) scale(1.2)}}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1a2233;border-radius:20px 20px 0 0;width:100%;max-height:80%;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:2px solid rgba(255,213,79,.3)}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{font-size:13px;opacity:.88;margin-bottom:10px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border-radius:12px;margin-bottom:8px}
.row .name{flex:1;font-weight:700;font-size:14px}
.row .price{color:var(--accent);font-weight:800}
.delta.up{color:#81c784;font-size:11px}
.delta.down{color:#ef9a9a;font-size:11px}
.night-overlay{position:absolute;inset:0;background:rgba(8,8,35,.58);z-index:12;pointer-events:none;opacity:0;transition:opacity .8s}
.night-overlay.on{opacity:1}
.pest{position:absolute;font-size:30px;z-index:18;cursor:pointer;filter:drop-shadow(0 2px 3px #000);animation:wiggle .35s infinite alternate;touch-action:manipulation}
@keyframes wiggle{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.08)}}
.story{font-size:12px;background:rgba(0,0,0,.38);border-left:3px solid var(--moon);padding:8px 10px;border-radius:0 12px 12px 0;line-height:1.4;width:100%;max-width:420px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);color:#1a1f2e}
.hint{font-size:11px;opacity:.7;margin-top:3px}
#intro{position:absolute;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 20%,#2a3a6a,#0a1020 70%);display:flex;flex-direction:column;justify-content:center;padding:28px;text-align:center}
#intro .logo{font-size:56px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(233,30,140,.4))}
#intro h1{font-size:26px;margin:10px 0 8px;background:linear-gradient(90deg,#ffd54f,#e91e8c,#80d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
#intro p{font-size:14px;opacity:.92;margin-bottom:18px;line-height:1.5}
.fx-burst{position:absolute;pointer-events:none;z-index:56;font-size:18px;animation:burst .7s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.mute{margin-left:auto}
</style>
</head>
<body>
<div id="app" class="season-spring">
  <div id="intro">
    <div class="logo">🏝️</div>
    <h1>Ферма на краю света</h1>
    <p>Парящий остров осыпается. Корми Сердце урожаем, скрещивай семена, ухаживай за животными и переживи ночных вредителей. Всё офлайн.</p>
    <p style="opacity:.6;font-size:12px;margin-bottom:10px">v1.1.0</p>
    <button class="btn" id="btn-start" style="font-size:16px;padding:14px 28px;margin:0 auto">Начать игру</button>
    <button class="btn ghost" id="btn-continue" style="margin:12px auto 0;display:none">Продолжить</button>
  </div>
  <div class="topbar">
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">⭐ ур.<span id="level">1</span></div>
    <div class="stat">❤️ <span id="heart-pct">0%</span></div>
    <div class="stat" id="wx-stat">☀️ Весна</div>
    <div class="stat" id="tod-stat">☀️ День</div>
    <button class="btn ghost mute" id="btn-mute" title="Звук">🔊</button>
    <button class="btn ghost" id="btn-market">Рынок</button>
    <button class="btn ghost" id="btn-book">Книга</button>
  </div>
  <div class="zonebar" id="zonebar"></div>
  <div class="night-overlay" id="night"></div>
  <div class="floaters" id="floaters"></div>
  <div class="stage-wrap" id="stage">
    <div class="order-chip" id="order-chip" style="display:none"></div>
    <div class="island zone-main" id="island">
      <div class="heart-bar"><div class="heart-fill" id="heart-fill"></div><div class="heart-label">❤️ Сердце острова</div></div>
      <div class="grid" id="grid"></div>
      <div class="animals" id="animals"></div>
    </div>
    <div class="story" id="story"></div>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
</div>
<script>
(function(){
'use strict';
const SAVE_KEY='farm_edge_world_v2';
const DAY_MS=120000;
const GROW_SCALE=0.12;

const SEASONS=['spring','summer','autumn','winter'];
const SEASON_RU={spring:'Весна',summer:'Лето',autumn:'Осень',winter:'Зима'};
const SEASON_EMO={spring:'🌸',summer:'☀️',autumn:'🍂',winter:'❄️'};
const WX_RU={clear:'Ясно',rain:'Дождь',drought:'Засуха',storm:'Шторм'};

const CROPS={
  wheat:{id:'wheat',name:'Пшеница',emoji:'🌾',cost:5,baseSell:12,grow:30,xp:3,unlock:1},
  carrot:{id:'carrot',name:'Морковь',emoji:'🥕',cost:8,baseSell:18,grow:45,xp:5,unlock:1},
  tomato:{id:'tomato',name:'Томат',emoji:'🍅',cost:15,baseSell:35,grow:70,xp:8,unlock:3},
  corn:{id:'corn',name:'Кукуруза',emoji:'🌽',cost:22,baseSell:50,grow:90,xp:12,unlock:5},
  potato:{id:'potato',name:'Картофель',emoji:'🥔',cost:28,baseSell:58,grow:100,xp:14,unlock:6},
  berry:{id:'berry',name:'Клубника',emoji:'🍓',cost:35,baseSell:72,grow:80,xp:16,unlock:7},
  pumpkin:{id:'pumpkin',name:'Тыква',emoji:'🎃',cost:40,baseSell:90,grow:120,xp:20,unlock:8},
  grape:{id:'grape',name:'Виноград',emoji:'🍇',cost:55,baseSell:120,grow:150,xp:25,unlock:10},
  melon:{id:'melon',name:'Арбуз',emoji:'🍉',cost:70,baseSell:150,grow:180,xp:30,unlock:12},
  sunf:{id:'sunf',name:'Подсолнух',emoji:'🌻',cost:48,baseSell:110,grow:110,xp:22,unlock:14},
  pepper:{id:'pepper',name:'Перец',emoji:'🌶️',cost:60,baseSell:130,grow:95,xp:26,unlock:15},
  rainbow:{id:'rainbow',name:'Цветок радуги',emoji:'🌺',cost:90,baseSell:200,grow:200,xp:40,unlock:18},
  glow:{id:'glow',name:'Светящаяся тыква',emoji:'✨',cost:0,baseSell:180,grow:100,xp:35,unlock:99,hybrid:true},
  firepep:{id:'firepep',name:'Огненный перец',emoji:'🔥',cost:0,baseSell:140,grow:80,xp:28,unlock:99,hybrid:true},
  starmelon:{id:'starmelon',name:'Звёздная дыня',emoji:'🌌',cost:0,baseSell:260,grow:140,xp:48,unlock:99,hybrid:true},
  sunpod:{id:'sunpod',name:'Солнечный стручок',emoji:'☀️',cost:0,baseSell:210,grow:90,xp:36,unlock:99,hybrid:true},
  rubyberry:{id:'rubyberry',name:'Рубиновая ягода',emoji:'💎',cost:0,baseSell:240,grow:85,xp:42,unlock:99,hybrid:true},
  goldcorn:{id:'goldcorn',name:'Золотая кукуруза',emoji:'👑',cost:0,baseSell:220,grow:100,xp:38,unlock:99,hybrid:true},
  frostroot:{id:'frostroot',name:'Морозный корень',emoji:'🧊',cost:0,baseSell:190,grow:110,xp:34,unlock:99,hybrid:true},
  stormleaf:{id:'stormleaf',name:'Лист шторма',emoji:'⚡',cost:0,baseSell:230,grow:95,xp:40,unlock:99,hybrid:true},
  voidfig:{id:'voidfig',name:'Инжир пустоты',emoji:'🌑',cost:0,baseSell:300,grow:160,xp:55,unlock:99,hybrid:true},
  moonfl:{id:'moonfl',name:'Лунный цветок',emoji:'🌙',cost:0,baseSell:200,grow:60,xp:40,unlock:99,hybrid:true,nightOnly:true,zone:'moon'},
};

const HYBRIDS=[
  {a:'pumpkin',b:'wheat',result:'glow'},
  {a:'tomato',b:'carrot',result:'firepep'},
  {a:'melon',b:'moonfl',result:'starmelon'},
  {a:'pepper',b:'sunf',result:'sunpod'},
  {a:'berry',b:'grape',result:'rubyberry'},
  {a:'corn',b:'wheat',result:'goldcorn'},
  {a:'potato',b:'carrot',result:'frostroot'},
  {a:'grape',b:'pepper',result:'stormleaf'},
  {a:'rainbow',b:'moonfl',result:'voidfig'},
  {a:'pumpkin',b:'berry',result:'glow'},
];

const ANIMAL_TYPES={
  chicken:{id:'chicken',name:'Курица',emoji:'🐔',cost:60,unlock:6,produce:'egg',produceEmoji:'🥚',produceSell:18,interval:40,traits:['храбрая','ленивая','крикливая']},
  cow:{id:'cow',name:'Корова',emoji:'🐮',cost:150,unlock:10,produce:'milk',produceEmoji:'🥛',produceSell:40,interval:70,traits:['добрая','прожорливая','сонная']},
  sheep:{id:'sheep',name:'Овца',emoji:'🐑',cost:120,unlock:12,produce:'wool',produceEmoji:'🧶',produceSell:35,interval:60,traits:['пушистая','упрямая','нежная']},
};

const ZONES=[
  {id:'main',name:'Ферма',emoji:'🌱',needHeart:0,needLevel:1},
  {id:'ruins',name:'Руины',emoji:'🏛️',needHeart:40,needLevel:4},
  {id:'moon',name:'Лунный сад',emoji:'🌙',needHeart:120,needLevel:8},
  {id:'pen',name:'Загон',emoji:'🐾',needHeart:80,needLevel:6},
];

const STORIES=[
  'Записка #1: «Остров держится на сердце. Корми его — и земля вернётся…»',
  'Записка #2: «У каменного круга я скрещивал семена. Светящаяся тыква спасла нас в шторм.»',
  'Записка #3: «Ночью приходят тени-жуки. Пугала помогают, но лучше бить их пальцем.»',
  'Записка #4: «Лунные цветы всходят только в темноте. Не проспи.»',
  'Записка #5: «В руинах шепчет ветер: сердце — не камень, а семя первого хранителя.»',
  'Записка #6: «Животные чувствуют край. Храбрая курица клюёт вредителей сама.»',
  'Записка #7: «Сезоны крутятся быстрее, чем на земле внизу. Смотри на небо.»',
  'Записка #8: «Звёздная дыня открывает путь к саду луны.»',
  'Записка #9: «Если край осыплется — не бросай Сердце. Оно помнит тебя.»',
  'Записка #10: «Ты — следующий хранитель. Остров выбрал тебя.»',
];

const LEVEL_XP=[0,0,20,50,90,140,200,270,360,460,580,720,880,1060,1260,1500,1780,2100,2460,2860,3300,3800,4350,4950,5600,6300,7100,8000,9000,10100,11300];
const HEART_THRESHOLDS=[0,15,40,80,140,220,320,450,600];

function growSec(c){return Math.max(7,Math.round(c.grow*GROW_SCALE));}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){return [...s].reduce((a,c)=>a+c.charCodeAt(0),0);}
function dailyMultipliers(day){const rnd=mulberry32(hashStr(day));const m={};Object.keys(CROPS).forEach(id=>{m[id]=0.7+rnd()*0.7;});return m;}
function sellPrice(id,mults){const c=CROPS[id];return Math.max(1,Math.round(c.baseSell*(mults[id]||1)));}
function xpForLevel(lv){return LEVEL_XP[Math.min(lv,LEVEL_XP.length-1)]||99999;}

/* ===== Audio (procedural, offline) ===== */
const AudioFX=(function(){
  let ctx=null, muted=false, master=null;
  function ensure(){
    if(muted) return null;
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);}
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function beep(freq,dur,type,vol){
    const c=ensure(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.2;
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime+dur);
  }
  return {
    setMuted(m){muted=m; if(master) master.gain.value=m?0:0.22;},
    isMuted(){return muted;},
    plant(){beep(320,.08,'triangle',.15);beep(420,.1,'sine',.1);},
    water(){beep(600,.05,'sine',.08);beep(500,.12,'sine',.1);},
    harvest(){beep(520,.07,'square',.1);beep(780,.12,'sine',.12);},
    coin(){beep(880,.06,'sine',.1);beep(1175,.1,'sine',.1);},
    feed(){beep(200,.15,'triangle',.15);beep(300,.2,'sine',.12);},
    level(){beep(440,.1,'sine',.12);beep(554,.1,'sine',.12);beep(659,.2,'sine',.14);},
    hit(){beep(180,.08,'sawtooth',.12);},
    ui(){beep(700,.04,'sine',.06);},
    weather(){beep(120,.3,'triangle',.08);},
    unlock(){beep(523,.1,'sine',.1);beep(784,.2,'sine',.12);},
  };
})();

const state={
  coins:50,xp:0,level:1,heart:0,
  dayKey:todayKey(),mults:null,
  seasonIdx:0,weather:'clear',weatherUntil:0,
  cycleStart:Date.now(),dayIndex:0,
  plots:[], // {zone,locked,cropId,plantedAt,watered,ready}
  inventory:{wheat:4,carrot:3},
  products:{},
  unlockedHybrids:[],
  animals:[],
  storyIdx:0,storiesRead:[0],
  selectedTool:'hand',selectedPlot:-1,
  zone:'main',
  pests:[],nightActive:false,
  order:null,ordersDone:0,
  scarecrows:0,
  muted:false,lastSave:0,tutStep:0,
};

function plotsUnlocked(){
  let n=4;
  for(let i=1;i<HEART_THRESHOLDS.length;i++) if(state.heart>=HEART_THRESHOLDS[i]) n=Math.min(24,4+i*2);
  n=Math.max(n,Math.min(24,4+Math.floor((state.level-1)/2)*2));
  return n;
}
function gridSize(n){
  if(n<=4)return{cols:2,rows:2}; if(n<=6)return{cols:3,rows:2}; if(n<=9)return{cols:3,rows:3};
  if(n<=12)return{cols:4,rows:3}; if(n<=16)return{cols:4,rows:4}; return{cols:4,rows:6};
}
function zoneUnlocked(z){
  return state.heart>=z.needHeart && state.level>=z.needLevel;
}
function ensurePlots(){
  const zones=['main','ruins','moon'];
  zones.forEach(z=>{
    const have=state.plots.filter(p=>p.zone===z).length;
    const need=z==='main'?plotsUnlocked():(zoneUnlocked(ZONES.find(x=>x.id===z))?Math.min(8,4+Math.floor(state.level/5)*2):0);
    for(let i=have;i<Math.max(need, z==='main'?24:8);i++){
      state.plots.push({zone:z,locked:i>=need,cropId:null,plantedAt:0,watered:false,ready:false});
    }
    state.plots.filter(p=>p.zone===z).forEach((p,i)=>{p.locked=i>=need;});
  });
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>t.classList.remove('show'),2400);
}
function floatText(x,y,text,color){
  const f=document.createElement('div');
  f.className='floater'; f.textContent=text; f.style.left=x+'px'; f.style.top=y+'px'; f.style.color=color||'#ffd54f';
  document.getElementById('floaters').appendChild(f);
  setTimeout(()=>f.remove(),1000);
}
function burstAt(el,emojis){
  if(!el) return;
  const r=el.getBoundingClientRect(), app=document.getElementById('app').getBoundingClientRect();
  (emojis||['✨','⭐']).forEach((e,i)=>{
    const b=document.createElement('div'); b.className='fx-burst'; b.textContent=e;
    b.style.left=(r.left-app.left+r.width/2)+'px'; b.style.top=(r.top-app.top+r.height/2)+'px';
    const ang=(Math.PI*2*i)/(emojis.length||2);
    b.style.setProperty('--dx',(Math.cos(ang)*40)+'px');
    b.style.setProperty('--dy',(Math.sin(ang)*40-20)+'px');
    document.getElementById('app').appendChild(b);
    setTimeout(()=>b.remove(),700);
  });
}

function addXp(n){
  state.xp+=n;
  while(state.level<30 && state.xp>=xpForLevel(state.level+1)){
    state.level++; AudioFX.level(); toast('⬆️ Уровень '+state.level+'!');
    ensurePlots(); maybeStory();
  }
}
function maybeStory(){
  const want=Math.min(STORIES.length-1, Math.floor(state.level/3)+Math.floor(state.heart/60)+state.ordersDone);
  if(want>state.storyIdx){
    state.storyIdx=want;
    if(!state.storiesRead.includes(want)) state.storiesRead.push(want);
    document.getElementById('story').textContent=STORIES[state.storyIdx];
    AudioFX.unlock(); toast('📜 Новая записка!');
  }
}
function feedHeart(amount){
  state.heart+=amount; ensurePlots(); maybeStory();
  AudioFX.feed(); toast('❤️ Сердце +'+amount);
  const fill=document.getElementById('heart-fill');
  burstAt(fill,['💖','✨','💕']);
}

function season(){return SEASONS[state.seasonIdx%4];}
function seasonGrowMult(){
  const s=season();
  if(s==='spring') return 0.9;
  if(s==='summer') return state.weather==='drought'?1.35:1.0;
  if(s==='autumn') return 1.05;
  return 1.25; // winter
}
function seasonSellBonus(id){
  const s=season();
  if(s==='autumn' && (id==='pumpkin'||id==='grape')) return 1.15;
  if(s==='summer' && (id==='berry'||id==='melon')) return 1.1;
  if(s==='spring' && (id==='carrot'||id==='wheat')) return 1.08;
  if(s==='winter' && (id==='frostroot'||id==='potato')) return 1.12;
  return 1;
}
function weatherGrowMult(){
  if(state.weather==='rain') return 0.85;
  if(state.weather==='drought') return 1.4;
  if(state.weather==='storm') return 1.2;
  return 1;
}
function isNight(){const t=((Date.now()-state.cycleStart)%DAY_MS)/DAY_MS; return t>=0.55&&t<0.92;}
function cycleLabel(){
  const t=((Date.now()-state.cycleStart)%DAY_MS)/DAY_MS;
  if(t<0.55) return {ico:'☀️',label:'День'};
  if(t<0.92) return {ico:'🌙',label:'Ночь'};
  return {ico:'🌅',label:'Рассвет'};
}

function rollWeather(){
  const s=season();
  const rnd=Math.random();
  let w='clear';
  if(s==='spring'){ w=rnd<0.45?'rain':rnd<0.55?'storm':'clear'; }
  else if(s==='summer'){ w=rnd<0.35?'drought':rnd<0.5?'storm':'clear'; }
  else if(s==='autumn'){ w=rnd<0.4?'rain':rnd<0.55?'storm':'clear'; }
  else { w=rnd<0.3?'storm':'clear'; }
  state.weather=w;
  state.weatherUntil=Date.now()+DAY_MS*(0.4+Math.random()*0.5);
  AudioFX.weather();
  toast((SEASON_EMO[s]||'')+' Погода: '+WX_RU[w]);
  applyWxClass();
}
function applyWxClass(){
  const app=document.getElementById('app');
  app.classList.remove('wx-rain','wx-storm','wx-drought','season-spring','season-summer','season-autumn','season-winter');
  app.classList.add('season-'+season());
  if(state.weather==='rain') app.classList.add('wx-rain');
  if(state.weather==='storm') app.classList.add('wx-storm');
  if(state.weather==='drought') app.classList.add('wx-drought');
}

function advanceTimeChunk(){
  // called when a full day cycle wraps
  state.dayIndex++;
  if(state.dayIndex%3===0){ state.seasonIdx=(state.seasonIdx+1)%4; toast(SEASON_EMO[season()]+' Наступила '+SEASON_RU[season()]); }
  rollWeather();
  genOrder();
}

function genOrder(){
  const unlocked=Object.values(CROPS).filter(c=>!c.hybrid && state.level>=c.unlock);
  if(!unlocked.length){ state.order=null; return; }
  const c=unlocked[Math.floor(Math.random()*unlocked.length)];
  const qty=1+Math.floor(Math.random()*3);
  const bonus=Math.round(c.baseSell*qty*(1.3+Math.random()*0.5));
  state.order={cropId:c.id,qty,progress:0,reward:bonus,xp:8+qty*3};
  renderOrder();
}
function renderOrder(){
  const el=document.getElementById('order-chip');
  if(!state.order){el.style.display='none';return;}
  const c=CROPS[state.order.cropId];
  el.style.display='flex';
  el.innerHTML=`<span style="font-size:22px">${c.emoji}</span><div><b>Заказ дня</b><div class="hint">${c.name} ${state.order.progress}/${state.order.qty} · награда ${state.order.reward}🪙</div></div>`;
}

function updateGrowth(){
  const now=Date.now();
  if(now>state.weatherUntil) rollWeather();
  const gMult=seasonGrowMult()*weatherGrowMult();
  state.plots.forEach(p=>{
    if(!p.cropId||p.ready||p.locked) return;
    const crop=CROPS[p.cropId];
    let need=growSec(crop)*1000*gMult;
    if(!p.watered) need*=1.55;
    if(state.weather==='rain' && !p.watered){ p.watered=true; } // auto water
    if(crop.nightOnly && !isNight()) return;
    if(now-p.plantedAt>=need) p.ready=true;
  });
  state.animals.forEach(a=>{
    const t=ANIMAL_TYPES[a.type];
    let iv=t.interval*1000;
    if(a.trait==='ленивая'||a.trait==='сонная') iv*=1.35;
    if(a.trait==='прожорливая') iv*=0.85;
    if(!a.ready && now-a.lastProduce>=iv) a.ready=true;
  });
}

function plotsForZone(){
  return state.plots.map((p,i)=>({p,i})).filter(x=>x.p.zone===state.zone);
}

function renderZones(){
  const bar=document.getElementById('zonebar');
  bar.innerHTML='';
  ZONES.forEach(z=>{
    const ok=zoneUnlocked(z);
    const b=document.createElement('button');
    b.className='zbtn'+(state.zone===z.id?' on':'');
    b.disabled=!ok;
    b.textContent=z.emoji+' '+z.name+(ok?'':' 🔒');
    b.onclick=()=>{ if(!ok)return; state.zone=z.id; AudioFX.ui(); renderAll(); };
    bar.appendChild(b);
  });
}

function renderGrid(){
  ensurePlots();
  const island=document.getElementById('island');
  island.className='island zone-'+state.zone;
  const list=state.plots.filter(p=>p.zone===state.zone);
  const unlockedCount=list.filter(p=>!p.locked).length || (state.zone==='main'?plotsUnlocked():0);
  // recompute lock for display zone
  const need=state.zone==='main'?plotsUnlocked():(zoneUnlocked(ZONES.find(z=>z.id===state.zone))?Math.min(8,4+Math.floor(state.level/5)*2):0);
  const zonePlots=state.plots.filter(p=>p.zone===state.zone);
  zonePlots.forEach((p,i)=>{p.locked=i>=need;});
  const showN=Math.max(need, state.zone==='main'?Math.min(24,need):need);
  const {cols,rows}=gridSize(Math.max(showN,4));
  const grid=document.getElementById('grid');
  grid.style.gridTemplateColumns=`repeat(${cols},58px)`;
  grid.innerHTML='';
  const now=Date.now();
  const gMult=seasonGrowMult()*weatherGrowMult();
  const indices=[];
  state.plots.forEach((p,i)=>{ if(p.zone===state.zone) indices.push(i); });
  for(let k=0;k<cols*rows && k<indices.length;k++){
    const i=indices[k]; const p=state.plots[i];
    const el=document.createElement('div');
    el.className='plot'+(p.locked?' locked':'')+(state.selectedPlot===i?' selected':'')+(p.ready?' ready':'');
    if(p.cropId&&!p.watered&&!p.ready&&!p.locked) el.classList.add('needs-water');
    if(p.locked) el.textContent='🔒';
    else if(!p.cropId) el.textContent='';
    else {
      const crop=CROPS[p.cropId];
      el.textContent=p.ready?crop.emoji:(p.watered?'🌱':'🌰');
      if(!p.ready){
        let needT=growSec(crop)*1000*gMult; if(!p.watered) needT*=1.55;
        const pct=Math.min(100,((now-p.plantedAt)/needT)*100);
        const bar=document.createElement('div'); bar.className='progress'; bar.innerHTML='<i style="width:'+pct+'%"></i>'; el.appendChild(bar);
      }
    }
    el.addEventListener('click',ev=>onPlotTap(i,ev));
    grid.appendChild(el);
  }
  const pct=Math.min(100,(state.heart/(HEART_THRESHOLDS[HEART_THRESHOLDS.length-1]||600))*100);
  document.getElementById('heart-fill').style.width=pct+'%';
  document.getElementById('heart-pct').textContent=Math.round(pct)+'%';

  // animals only in pen
  const ab=document.getElementById('animals');
  ab.innerHTML='';
  if(state.zone==='pen'){
    if(!state.animals.length){
      ab.innerHTML='<div class="hint" style="text-align:center;padding:8px">Купи животных на рынке → вкладка «Животные»</div>';
    }
    state.animals.forEach((a,idx)=>{
      const t=ANIMAL_TYPES[a.type];
      const d=document.createElement('div');
      d.className='animal'+(a.ready?' ready':'');
      d.innerHTML=`<span class="ae">${t.emoji}</span>${t.name}<div class="hint">${a.trait}</div>${a.ready?t.produceEmoji+' готово':'…'}`;
      d.onclick=()=>collectAnimal(idx);
      ab.appendChild(d);
    });
  }
}

function renderToolbar(){
  const tb=document.getElementById('toolbar');
  const tools=[
    {id:'hand',ico:'👆',label:'Рука',price:''},
    {id:'water',ico:'💧',label:'Полив',price:''},
    {id:'feed',ico:'❤️',label:'Кормить',price:''},
    {id:'scare',ico:'🎃',label:'Пугало',price:'15🪙'},
  ];
  const seeds=Object.values(CROPS).filter(c=>{
    if(c.hybrid) return (state.inventory[c.id]>0)||state.unlockedHybrids.includes(c.id);
    return state.level>=c.unlock;
  });
  let html='';
  tools.forEach(t=>{
    html+=`<button class="tool ${state.selectedTool===t.id?'active':''}" data-tool="${t.id}"><span class="t-ico">${t.ico}</span>${t.label}<div class="t-price">${t.price}</div></button>`;
  });
  seeds.forEach(c=>{
    const owned=state.inventory[c.id]||0;
    const tid='seed:'+c.id;
    const price=owned>0?('×'+owned):(c.hybrid?'—':c.cost+'🪙');
    html+=`<button class="tool ${state.selectedTool===tid?'active':''}" data-tool="${tid}"><span class="t-ico">${c.emoji}</span>${c.name}<div class="t-price">${price}</div></button>`;
  });
  tb.innerHTML=html;
  tb.querySelectorAll('.tool').forEach(btn=>{
    btn.onclick=()=>{state.selectedTool=btn.dataset.tool;AudioFX.ui();renderToolbar();};
  });
}

function onPlotTap(i,ev){
  const p=state.plots[i];
  if(p.locked){toast('🔒 Корми Сердце или повысь уровень');return;}
  if(p.zone!==state.zone){state.zone=p.zone;}
  state.selectedPlot=i;
  const tool=state.selectedTool;
  const target=ev&&ev.currentTarget;

  if(tool==='hand'){
    if(p.ready&&p.cropId) harvest(i,target);
    else if(p.cropId) toast(CROPS[p.cropId].name+(p.watered?' растёт…':' — нужен полив!'));
    else toast('Выбери семена внизу');
  } else if(tool==='water'){
    if(!p.cropId) toast('Нечего поливать');
    else if(p.ready) toast('Уже созрело');
    else if(p.watered) toast('Уже полито');
    else {p.watered=true;AudioFX.water();toast('💧');burstAt(target,['💧','💦']);}
  } else if(tool==='feed'){
    if(p.ready&&p.cropId){
      const crop=CROPS[p.cropId];
      const feed=Math.max(2,Math.round(crop.xp*1.5));
      p.cropId=null;p.plantedAt=0;p.watered=false;p.ready=false;
      feedHeart(feed); addXp(2); burstAt(target,['❤️','💖']);
    } else toast('Скорми созревший урожай Сердцу');
  } else if(tool==='scare'){
    if(state.coins<15){toast('Нужно 15 монет');return;}
    state.coins-=15; state.scarecrows++;
    state.pests.slice().forEach(pe=>{removePest(pe);});
    AudioFX.hit(); toast('🎃 Пугало!'); updateHUD();
  } else if(tool.startsWith('seed:')){
    plant(i,tool.slice(5),target);
  }
  renderGrid(); save();
}

function plant(i,id,el){
  const p=state.plots[i];
  if(p.locked||p.cropId){toast('Грядка занята');return;}
  const crop=CROPS[id];
  if(crop.zone&&crop.zone!==state.zone){toast('Сажается только в зоне: '+crop.zone);return;}
  if(crop.nightOnly&&!isNight()){toast('Только ночью');return;}
  let have=state.inventory[id]||0;
  if(have>0) state.inventory[id]=have-1;
  else if(!crop.hybrid){
    if(state.coins<crop.cost){toast('Мало монет');return;}
    state.coins-=crop.cost;
  } else {toast('Нет семян гибрида');return;}
  p.cropId=id; p.plantedAt=Date.now(); p.watered=false; p.ready=false;
  AudioFX.plant(); toast('Посадили '+crop.emoji); burstAt(el,['🌱','✨']);
  if(el) el.classList.add('pop');
  updateHUD(); renderToolbar();
}

function harvest(i,el){
  const p=state.plots[i];
  const crop=CROPS[p.cropId];
  let price=Math.round(sellPrice(p.cropId,state.mults)*seasonSellBonus(p.cropId));
  if(state.weather==='storm' && Math.random()<0.15){ toast('💨 Шторм повредил урожай (−30%)'); price=Math.round(price*0.7); }
  state.coins+=price; addXp(crop.xp);
  if(Math.random()<0.4) state.inventory[p.cropId]=(state.inventory[p.cropId]||0)+1;
  // order progress
  if(state.order && state.order.cropId===p.cropId && state.order.progress<state.order.qty){
    state.order.progress++;
    if(state.order.progress>=state.order.qty){
      state.coins+=state.order.reward; addXp(state.order.xp); state.ordersDone++;
      AudioFX.coin(); toast('📦 Заказ выполнен! +'+state.order.reward+'🪙');
      state.order=null; maybeStory(); genOrder();
    } else renderOrder();
  }
  AudioFX.harvest(); AudioFX.coin();
  toast(crop.emoji+' +'+price+'🪙'); burstAt(el,[crop.emoji,'🪙','✨']);
  floatNear(el,'+'+price+'🪙');
  p.cropId=null;p.plantedAt=0;p.watered=false;p.ready=false;
  updateHUD();
}

function floatNear(el,text){
  if(!el) return;
  const r=el.getBoundingClientRect(), app=document.getElementById('app').getBoundingClientRect();
  floatText(r.left-app.left+10, r.top-app.top, text, '#ffd54f');
}

function collectAnimal(idx){
  const a=state.animals[idx]; if(!a||!a.ready){toast('Ещё не готово');return;}
  const t=ANIMAL_TYPES[a.type];
  let price=t.produceSell;
  if(a.trait==='храбрая') price=Math.round(price*1.1);
  state.coins+=price; addXp(5);
  state.products[t.produce]=(state.products[t.produce]||0)+1;
  a.ready=false; a.lastProduce=Date.now();
  // brave chicken may clear a pest
  if(a.trait==='храбрая' && state.pests.length){ removePest(state.pests[0]); toast('🐔 Курица прогнала вредителя!'); }
  AudioFX.coin(); toast(t.produceEmoji+' +'+price+'🪙');
  updateHUD(); renderGrid(); save();
}

function buyAnimal(typeId){
  const t=ANIMAL_TYPES[typeId];
  if(state.level<t.unlock){toast('Нужен ур.'+t.unlock);return;}
  if(!zoneUnlocked(ZONES.find(z=>z.id==='pen'))){toast('Сначала открой Загон');return;}
  if(state.animals.length>=6){toast('Макс. 6 животных');return;}
  if(state.coins<t.cost){toast('Мало монет');return;}
  state.coins-=t.cost;
  const trait=t.traits[Math.floor(Math.random()*t.traits.length)];
  state.animals.push({type:typeId,trait,lastProduce:Date.now(),ready:false});
  AudioFX.unlock(); toast(t.emoji+' Новая '+t.name+' («'+trait+'»)');
  updateHUD(); renderToolbar(); save();
}

/* Market / Book */

function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});

function openMarket(){

  <div class="tabs">
    <button class="tab on" data-tab="prices">Цены</button>

        rows+=`<div class="row"><span style="font-size:22px">${c.emoji}</span><div class="name">${c.name}<div class="delta ${cls}">${delta>=0?'+':''}${delta.toFixed(0)}% · сезон ×${seasonSellBonus(id).toFixed(2)}</div></div><div class="price">${price}🪙</div></div>`;
      });
      rows+='<p class="hint">Урожай продаётся с грядки (Рука). Продукты животных — в книге.</p>';
      tabBox.innerHTML=rows;
    } else if(tab==='buy'){
      let rows='';
      Object.values(CROPS).filter(c=>!c.hybrid&&state.level>=c.unlock).forEach(c=>{
        rows+=`<div class="row"><span style="font-size:22px">${c.emoji}</span><div class="name">${c.name}<div class="hint">~${growSec(c)}с · ${Math.round(sellPrice(c.id,state.mults)*seasonSellBonus(c.id))}🪙</div></div><button class="btn" data-buy="${c.id}">${c.cost}🪙</button></div>`;
      });
      tabBox.innerHTML=rows;
      tabBox.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
        const c=CROPS[b.dataset.buy]; if(state.coins<c.cost){toast('Мало монет');return;}
        state.coins-=c.cost; state.inventory[c.id]=(state.inventory[c.id]||0)+1;
        AudioFX.coin(); toast('Семена '+c.emoji); updateHUD(); renderToolbar(); save(); openMarket(); setTimeout(()=>document.querySelector('.tab[data-tab=buy]')?.click(),0);
      });
    } else if(tab==='craft'){
      let rows='<p>Потрать по 1 семени родителей.</p>';
      const seen=new Set();
      HYBRIDS.forEach(h=>{
        if(seen.has(h.result)) return; seen.add(h.result);
        const r=CROPS[h.result]; const un=state.unlockedHybrids.includes(h.result);
        rows+=`<div class="row"><span style="font-size:22px">${r.emoji}</span><div class="name">${r.name}<div class="hint">${CROPS[h.a].emoji}+${CROPS[h.b].emoji}${un?' ✓':''}</div></div><button class="btn" data-craft="${h.result}">Скрестить</button></div>`;
      });
      tabBox.innerHTML=rows;
      tabBox.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>{craft(b.dataset.craft); openMarket(); setTimeout(()=>document.querySelector('.tab[data-tab=craft]')?.click(),0);});
    } else {
      let rows='<p>Животные живут в Загоне. У каждого свой характер.</p>';
      Object.values(ANIMAL_TYPES).forEach(t=>{
        rows+=`<div class="row"><span style="font-size:22px">${t.emoji}</span><div class="name">${t.name}<div class="hint">ур.${t.unlock} · ${t.produceEmoji} ~${t.produceSell}🪙</div></div><button class="btn" data-an="${t.id}">${t.cost}🪙</button></div>`;
      });
      tabBox.innerHTML=rows;
      tabBox.querySelectorAll('[data-an]').forEach(b=>b.onclick=()=>{buyAnimal(b.dataset.an); openMarket(); setTimeout(()=>document.querySelector('.tab[data-tab=animals]')?.click(),0);});
    }
  }
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>show(t.dataset.tab)));
  document.getElementById('mclose').onclick=closeModal;
  show('prices');
}

function craft(resultId){
  const h=HYBRIDS.find(x=>x.result===resultId);
  if(!h) return;
  if((state.inventory[h.a]||0)<1||(state.inventory[h.b]||0)<1){toast('Нужны семена родителей');return;}
  state.inventory[h.a]--; state.inventory[h.b]--;
  state.inventory[resultId]=(state.inventory[resultId]||0)+1;
  if(!state.unlockedHybrids.includes(resultId)){state.unlockedHybrids.push(resultId);addXp(15);AudioFX.unlock();toast('🧬 Новый гибрид: '+CROPS[resultId].name);}
  else {AudioFX.plant();toast('🧬 '+CROPS[resultId].emoji);}
  renderToolbar(); save();
}

function openBook(){
  const nextH=HEART_THRESHOLDS.find(t=>t>state.heart)||'макс';
  let html=`<h2>📖 Книга фермера</h2>
  <p><b>Сердце:</b> ${state.heart} (след. порог ${nextH}) · <b>Заказы:</b> ${state.ordersDone}</p>
  <p><b>Сезон:</b> ${SEASON_RU[season()]} · <b>Погода:</b> ${WX_RU[state.weather]}</p>
  <div class="story">${STORIES[state.storyIdx]}</div>
  <p style="margin-top:8px"><b>Все записки:</b></p>`;
  state.storiesRead.slice().sort((a,b)=>a-b).forEach(i=>{html+=`<div class="story" style="margin:6px 0">${STORIES[i]}</div>`;});
  html+=`<p><b>Гибриды:</b> ${state.unlockedHybrids.map(id=>CROPS[id].emoji+' '+CROPS[id].name).join(', ')||'пока нет'}</p>`;
  html+=`<p><b>Продукты:</b> 🥚${state.products.egg||0} 🥛${state.products.milk||0} 🧶${state.products.wool||0}</p>`;
  html+=`<p class="hint">12 базовых культур · 10 гибридов · животные с чертами · сезоны и погода · зоны острова</p>`;
  html+=`<button class="btn" id="sell-prod" style="width:100%;margin:8px 0">Продать продукты животных</button>`;
  html+=`<p class="hint">Обновления: манифест = localStorage.farm_manifest_url</p>`;
  html+=`<button class="btn ghost" id="chk-upd" style="width:100%;margin:6px 0">Проверить обновления</button>`;
  html+=`<button class="btn danger" id="reset-save">Сбросить прогресс</button> `;
  html+=`<button class="btn ghost" id="bclose">Закрыть</button>`;
  openModal(html);
  document.getElementById('bclose').onclick=closeModal;
  document.getElementById('reset-save').onclick=()=>{localStorage.removeItem(SAVE_KEY);location.reload();};
  document.getElementById('chk-upd').onclick=async()=>{closeModal(); toast('Проверка…'); const r=await checkForUpdates(); if(r.upToDate) toast('У вас актуальная версия'); if(r.skipped) toast('Манифест не настроен: '+r.reason);};
  document.getElementById('sell-prod').onclick=()=>{
    let gain=0;
    gain+=(state.products.egg||0)*18; gain+=(state.products.milk||0)*40; gain+=(state.products.wool||0)*35;
    if(!gain){toast('Нет продуктов');return;}
    state.coins+=gain; state.products={}; AudioFX.coin(); toast('Продали на '+gain+'🪙'); updateHUD(); save(); openBook();
  };
}

/* Pests */
function spawnPest(){
  if(state.pests.length>=7) return;
  if(state.scarecrows>0 && Math.random()<0.4) return;
  const island=document.getElementById('island');
  const pe={id:Math.random().toString(36).slice(2),x:8+Math.random()*84,y:18+Math.random()*62,el:null};
  const el=document.createElement('div'); el.className='pest';
  el.textContent=Math.random()<0.5?'🐛':'🪲';
  el.style.left=pe.x+'%'; el.style.top=pe.y+'%'; el.style.position='absolute';
  island.appendChild(el); pe.el=el;
  el.onclick=e=>{e.stopPropagation();squashPest(pe);};
  state.pests.push(pe);
  pe.timer=setTimeout(()=>{
    if(!state.pests.includes(pe)) return;
    const cand=state.plots.map((p,i)=>({p,i})).filter(x=>x.p.cropId&&!x.p.locked&&x.p.zone===state.zone);
    if(cand.length){
      const pick=cand[Math.floor(Math.random()*cand.length)];
      pick.p.cropId=null;pick.p.plantedAt=0;pick.p.watered=false;pick.p.ready=false;
      toast('🐛 Урожай съеден!'); renderGrid();
    }
    removePest(pe);
  },7500);
}
function squashPest(pe){
  state.coins+=4; addXp(2);
  if(Math.random()<0.28){
    state.inventory.moonfl=(state.inventory.moonfl||0)+1;
    if(!state.unlockedHybrids.includes('moonfl')) state.unlockedHybrids.push('moonfl');
    toast('🌙 Лунный цветок! +4🪙');
  } else toast('💥 +4🪙');
  AudioFX.hit(); removePest(pe); updateHUD(); renderToolbar(); save();
}
function removePest(pe){
  clearTimeout(pe.timer); state.pests=state.pests.filter(x=>x!==pe);
  if(pe.el&&pe.el.parentNode) pe.el.parentNode.removeChild(pe.el);
}
function setNight(on){
  document.getElementById('night').classList.toggle('on',on);
  if(on&&!state.nightActive){state.nightActive=true;toast('🌙 Ночь! Береги посевы');}
  if(!on&&state.nightActive){state.nightActive=false;state.pests.slice().forEach(removePest);state.scarecrows=Math.max(0,state.scarecrows-1);toast('☀️ Рассвет');}
}

function updateHUD(){
  document.getElementById('coins').textContent=state.coins;
  document.getElementById('level').textContent=state.level;
  const cl=cycleLabel();
  document.getElementById('tod-stat').textContent=cl.ico+' '+cl.label;
  document.getElementById('wx-stat').textContent=(SEASON_EMO[season()]||'')+' '+SEASON_RU[season()]+' · '+WX_RU[state.weather];
}

function save(){
  const data={
    coins:state.coins,xp:state.xp,level:state.level,heart:state.heart,dayKey:state.dayKey,
    seasonIdx:state.seasonIdx,weather:state.weather,weatherUntil:state.weatherUntil,dayIndex:state.dayIndex,
    inventory:state.inventory,products:state.products,unlockedHybrids:state.unlockedHybrids,
    animals:state.animals,storyIdx:state.storyIdx,storiesRead:state.storiesRead,
    cycleStart:state.cycleStart,order:state.order,ordersDone:state.ordersDone,muted:state.muted,
    plots:state.plots.map(p=>({zone:p.zone,locked:p.locked,cropId:p.cropId,plantedAt:p.plantedAt,watered:p.watered,ready:p.ready})),
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw);
    Object.assign(state,{
      coins:d.coins,xp:d.xp,level:d.level,heart:d.heart,dayKey:d.dayKey||todayKey(),
      seasonIdx:d.seasonIdx||0,weather:d.weather||'clear',weatherUntil:d.weatherUntil||0,dayIndex:d.dayIndex||0,
      inventory:d.inventory||{},products:d.products||{},unlockedHybrids:d.unlockedHybrids||[],
      animals:d.animals||[],storyIdx:d.storyIdx||0,storiesRead:d.storiesRead||[0],
      cycleStart:d.cycleStart||Date.now(),order:d.order||null,ordersDone:d.ordersDone||0,muted:!!d.muted,
      plots:d.plots||[],
    });
    return true;
  }catch(e){return false;}
}

function refreshDay(){
  const d=todayKey();
  if(d!==state.dayKey){state.dayKey=d; genOrder();}
  state.mults=dailyMultipliers(state.dayKey);
  if(!state.order) genOrder();
}

let lastCycleBucket=-1;
function tick(){
  updateGrowth();
  const night=isNight(); setNight(night);
  if(night && Math.random()<0.035) spawnPest();
  const bucket=Math.floor(((Date.now()-state.cycleStart)%DAY_MS)/(DAY_MS));
  // detect wrap via cycle progress
  const prog=((Date.now()-state.cycleStart)%DAY_MS)/DAY_MS;
  if(prog<0.02 && lastCycleBucket>0.5){ advanceTimeChunk(); }
  lastCycleBucket=prog;
  renderGrid(); updateHUD(); renderOrder();
  if(Date.now()-state.lastSave>6000){state.lastSave=Date.now();save();}
}

function renderAll(){renderZones();renderToolbar();renderGrid();updateHUD();renderOrder();applyWxClass();
  document.getElementById('story').textContent=STORIES[state.storyIdx];
}

function startGame(){
  document.getElementById('intro').style.display='none';
  setTimeout(()=>checkForUpdates().catch(()=>{}), 800);
  AudioFX.setMuted(state.muted);
  document.getElementById('btn-mute').textContent=state.muted?'🔇':'🔊';
  refreshDay(); ensurePlots();
  if(!state.weatherUntil) rollWeather();
  renderAll();
  setInterval(tick,450);
  save();
}

document.getElementById('btn-market').onclick=openMarket;
document.getElementById('btn-book').onclick=openBook;
document.getElementById('btn-mute').onclick=()=>{
  state.muted=!state.muted; AudioFX.setMuted(state.muted);
  document.getElementById('btn-mute').textContent=state.muted?'🔇':'🔊'; save();
};

const hasSave=load();
if(hasSave){
  document.getElementById('btn-continue').style.display='block';
  document.getElementById('btn-continue').onclick=startGame;
  document.getElementById('btn-start').textContent='Новая игра';
  document.getElementById('btn-start').onclick=()=>{localStorage.removeItem(SAVE_KEY);location.reload();};
} else {
  document.getElementById('btn-start').onclick=startGame;
}


/* ===== Auto-update ===== */
const APP_VERSION = { version: '1.1.0', versionCode: 2, webVersion: '1.1.0' };
const DEFAULT_MANIFEST_URL = localStorage.getItem('farm_manifest_url') || 'https://alexpoleo19772301-boop.github.io/farm-edge-world/version.json';

function cmpSemver(a,b){
  const pa=String(a||'0').split('.').map(n=>parseInt(n,10)||0);
  const pb=String(b||'0').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<3;i++){ const d=(pa[i]||0)-(pb[i]||0); if(d) return d; }
  return 0;
}
function getAppUpdatePlugin(){
  try{
    const C=window.Capacitor;
    if(!C) return null;
    if(C.Plugins && C.Plugins.AppUpdate) return C.Plugins.AppUpdate;
    if(typeof C.registerPlugin==='function') return C.registerPlugin('AppUpdate');
  }catch(e){}
  return null;
}
function showUpdateDialog(manifest, mode){
  return new Promise(resolve=>{
    const bg=document.createElement('div');
    bg.className='modal-bg open'; bg.style.zIndex='90';
    const force=!!manifest.force;
    bg.innerHTML=`<div class="modal" style="max-height:70%">
      <h2>Доступно обновление</h2>
      <p><b>${manifest.version||''}</b> ${mode==='web'?'(контент)':'(APK)'}</p>
      <p style="white-space:pre-wrap">${(manifest.changelog||'').replace(/</g,'&lt;')}</p>
      <div id="upd-status" class="hint" style="margin:8px 0;min-height:1.2em"></div>
      <button class="btn" id="upd-yes" style="width:100%;margin-bottom:8px">Обновить</button>
      ${force?'':`<button class="btn ghost" id="upd-no" style="width:100%">Позже</button>`}
    </div>`;
    document.getElementById('app').appendChild(bg);
    const status=()=>bg.querySelector('#upd-status');
    bg.querySelector('#upd-yes').onclick=async()=>{
      const btn=bg.querySelector('#upd-yes'); btn.disabled=true; btn.textContent='Загрузка…';
      try{
        const plugin=getAppUpdatePlugin();
        if(mode==='web' && manifest.webBundleUrl && plugin && plugin.downloadAndApplyWebBundle){
          status().textContent='Скачиваем контент…';
          await plugin.downloadAndApplyWebBundle({url:manifest.webBundleUrl, webVersion:manifest.webVersion||manifest.version});
          status().textContent='Готово! Перезагрузка…';
          resolve('web'); bg.remove(); return;
        }
        if(manifest.apkUrl && plugin && plugin.downloadAndInstallApk){
          status().textContent='Скачиваем APK… Разрешите установку, если спросит система.';
          try{
            const can=await plugin.canInstallPackages();
            if(can && can.allowed===false){ await plugin.requestInstallPermission(); status().textContent='Включите «Установка неизвестных приложений», затем нажмите Обновить снова.'; btn.disabled=false; btn.textContent='Обновить'; return; }
          }catch(e){}
          await plugin.downloadAndInstallApk({url:manifest.apkUrl});
          status().textContent='Открыт установщик. Подтвердите установку.';
          resolve('apk'); return;
        }
        // Browser / fallback
        const url=manifest.apkUrl||manifest.webBundleUrl;
        if(url){
          if(plugin && plugin.openUrl) await plugin.openUrl({url});
          else window.open(url,'_blank');
          status().textContent='Ссылка открыта в браузере.';
          resolve('browser');
        } else {
          status().textContent='URL обновления не задан в манифесте.';
          btn.disabled=false; btn.textContent='Обновить';
        }
      }catch(e){
        status().textContent='Ошибка: '+(e.message||e);
        // last resort open apk url
        try{
          const plugin=getAppUpdatePlugin();
          if(manifest.apkUrl){
            if(plugin&&plugin.openUrl) await plugin.openUrl({url:manifest.apkUrl});
            else window.open(manifest.apkUrl,'_blank');
          }
        }catch(_){}
        btn.disabled=false; btn.textContent='Обновить';
      }
    };
    const no=bg.querySelector('#upd-no');
    if(no) no.onclick=()=>{resolve('later'); bg.remove();};
  });
}
async function checkForUpdates(opts){
  opts=opts||{};
  const url=opts.manifestUrl||DEFAULT_MANIFEST_URL;
  if(!url || url.indexOf('PLACEHOLDER')>=0){
    console.info('[update] Manifest URL not configured. Set localStorage.farm_manifest_url');
    return {skipped:true, reason:'no-manifest-url'};
  }
  let manifest;
  try{
    const plugin0=getAppUpdatePlugin();
    if(plugin0 && plugin0.fetchManifest){
      const native=await plugin0.fetchManifest({url: url + (url.indexOf('?')>=0?'&':'?') + 't=' + Date.now()});
      if(native.manifest) manifest=native.manifest;
      else manifest=JSON.parse(native.body);
    } else {
      const res=await fetch(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now(), {cache:'no-store', mode:'cors'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      manifest=await res.json();
    }
  }catch(e){
    console.warn('[update] fetch failed', e);
    return {skipped:true, reason:String(e.message||e)};
  }
  const plugin=getAppUpdatePlugin();
  let localCode=APP_VERSION.versionCode, localName=APP_VERSION.version, localWeb=APP_VERSION.webVersion;
  if(plugin && plugin.getInfo){
    try{
      const info=await plugin.getInfo();
      localCode=info.versionCode||localCode;
      localName=info.versionName||localName;
      localWeb=info.webVersion||localWeb;
    }catch(e){}
  }
  // Prefer light web live-update when possible
  if(manifest.webBundleUrl && cmpSemver(manifest.webVersion||manifest.version, localWeb)>0){
    if(!opts.silent) await showUpdateDialog(manifest,'web');
    return {update:'web', manifest};
  }
  const remoteCode=parseInt(manifest.versionCode,10)||0;
  const needApk=(remoteCode>localCode) || (cmpSemver(manifest.version, localName)>0);
  if(needApk && (manifest.apkUrl||'').length){
    if(!opts.silent) await showUpdateDialog(manifest,'apk');
    return {update:'apk', manifest};
  }
  return {upToDate:true, manifest, localName, localWeb};
}
window.__FARM_UPDATE__={checkForUpdates, showUpdateDialog, APP_VERSION, DEFAULT_MANIFEST_URL, getAppUpdatePlugin, cmpSemver};

window.__FARM__={state,CROPS,HYBRIDS,ANIMAL_TYPES,ZONES,sellPrice,growSec,craft,buyAnimal,feedHeart,ensurePlots,refreshDay,genOrder,season,AudioFX,checkForUpdates,APP_VERSION};
})();
</script>

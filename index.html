<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2744"/>
<title>Ферма на краю света</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#070b14;color:#eee;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:#0a1520}
.topbar{display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,0,0,.55);backdrop-filter:blur(10px);flex-wrap:wrap;align-items:center;z-index:30}
.stat{background:rgba(36,48,68,.92);border-radius:12px;padding:5px 9px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;border:1px solid rgba(255,255,255,.08)}
.btn{border:none;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;background:#ffd54f;color:#1a1f2e}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn.danger{background:#f44336;color:#fff}
.btn:disabled{opacity:.45}
.zonebar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;z-index:25;background:rgba(0,0,0,.28)}
.zbtn{flex-shrink:0;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}
.zbtn.on{background:#ffd54f;color:#1a1f2e}
.zbtn:disabled{opacity:.35}
.stage{flex:1;position:relative;min-height:0;z-index:5}
#game{display:block;width:100%;height:100%;touch-action:none}
.order-chip{position:absolute;left:8px;right:8px;top:8px;z-index:20;background:rgba(0,0,0,.55);border:1px solid rgba(255,213,79,.4);border-radius:14px;padding:8px 10px;font-size:12px;display:none;backdrop-filter:blur(6px)}
.story{position:absolute;left:8px;right:8px;bottom:8px;z-index:20;font-size:11px;background:rgba(0,0,0,.5);border-left:3px solid #b39ddb;padding:8px 10px;border-radius:0 12px 12px 0;line-height:1.35;max-height:64px;overflow:auto}
.toolbar{display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(0,0,0,.65);backdrop-filter:blur(12px);overflow-x:auto;z-index:30}
.tool{min-width:66px;padding:8px 6px;border-radius:14px;border:2px solid transparent;background:#243044;color:#fff;font-size:11px;font-weight:700;text-align:center;flex-shrink:0}
.tool.active{border-color:#ffd54f;background:#3a4a66;box-shadow:0 0 10px rgba(255,213,79,.25)}
.tool .t-ico{font-size:20px;display:block}
.tool .t-price{opacity:.75;font-size:10px}
.toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:rgba(0,0,0,.88);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:92%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#1a2233;border-radius:20px 20px 0 0;width:100%;max-height:80%;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:2px solid rgba(255,213,79,.3)}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{font-size:13px;opacity:.88;margin-bottom:10px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:#243044;border-radius:12px;margin-bottom:8px}
.row .name{flex:1;font-weight:700;font-size:14px}
.row .price{color:#ffd54f;font-weight:800}
.delta.up{color:#81c784;font-size:11px}
.delta.down{color:#ef9a9a;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:12px;font-weight:700}
.tab.on{background:#ffd54f;color:#1a1f2e}
.hint{font-size:11px;opacity:.7;margin-top:3px}
#intro{position:absolute;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 20%,#2a3a6a,#0a1020 70%);display:flex;flex-direction:column;justify-content:center;padding:28px;text-align:center}
#intro h1{font-size:26px;margin:10px 0 8px;background:linear-gradient(90deg,#ffd54f,#e91e8c,#80d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
#intro p{font-size:14px;opacity:.92;margin-bottom:18px;line-height:1.5}
#intro canvas{width:160px;height:120px;margin:0 auto 8px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
</style>
</head>
<body>
<div id="app">
  <div id="intro">
    <canvas id="intro-art" width="160" height="120"></canvas>
    <h1>Ферма на краю света</h1>
    <p>Парящий остров осыпается. Корми Сердце, скрещивай семена, ухаживай за животными. Объёмная 2D-ферма офлайн.</p>
    <p style="opacity:.6;font-size:12px;margin-bottom:10px">v1.2.0</p>
    <button class="btn" id="btn-start" style="font-size:16px;padding:14px 28px;margin:0 auto">Начать игру</button>
    <button class="btn ghost" id="btn-continue" style="margin:12px auto 0;display:none">Продолжить</button>
  </div>
  <div class="topbar">
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">⭐ ур.<span id="level">1</span></div>
    <div class="stat">❤️ <span id="heart-pct">0%</span></div>
    <div class="stat" id="wx-stat">☀️ Весна</div>
    <div class="stat" id="tod-stat">☀️ День</div>
    <button class="btn ghost" id="btn-mute" style="margin-left:auto">🔊</button>
    <button class="btn ghost" id="btn-market">Рынок</button>
    <button class="btn ghost" id="btn-book">Книга</button>
  </div>
  <div class="zonebar" id="zonebar"></div>
  <div class="stage">
    <canvas id="game" width="390" height="520"></canvas>
    <div class="order-chip" id="order-chip"></div>
    <div class="story" id="story"></div>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
